<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treinamento de Inteligência Artificial</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #08080f; color: #fff; min-height: 100vh; }

  /* NAV MODULES */
  .mod-nav { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 40px; background: rgba(255,255,255,0.03); border-bottom: 1px solid #1a1a2e; position: sticky; top: 0; z-index: 100; }
  .mod-btn { font-size: 12px; color: rgba(255,255,255,0.4); background: none; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 6px 14px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .mod-btn:hover { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.2); }
  .mod-btn.active { color: #7F77DD; border-color: #534AB7; background: rgba(83,74,183,0.12); }

  /* SLIDE NAV */
  .slide-nav { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 40px; background: rgba(255,255,255,0.015); border-bottom: 1px solid #111122; }
  .slide-btn { font-size: 11px; color: rgba(255,255,255,0.3); background: none; border: none; cursor: pointer; padding: 4px 10px; border-radius: 4px; transition: all 0.2s; }
  .slide-btn:hover { color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.05); }
  .slide-btn.active { color: #AFA9EC; background: rgba(83,74,183,0.1); }

  /* SLIDE */
  .slide { min-height: calc(100vh - 120px); display: flex; flex-direction: column; justify-content: center; padding: 60px 64px; position: relative; overflow: hidden; }
  .slide::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 75% 15%, rgba(83,74,183,0.15) 0%, transparent 55%); pointer-events: none; }
  .slide::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(83,74,183,0.4), transparent); }

  /* TYPOGRAPHY */
  .tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: #7F77DD; border: 1px solid rgba(83,74,183,0.5); border-radius: 20px; padding: 5px 14px; margin-bottom: 24px; }
  .tag.green { color: #5DCAA5; border-color: rgba(29,158,117,0.5); }
  .tag.coral { color: #F0997B; border-color: rgba(216,90,48,0.5); }
  .tag.amber { color: #EF9F27; border-color: rgba(186,117,23,0.5); }
  h1 { font-size: 54px; font-weight: 500; line-height: 1.12; color: #fff; }
  h2 { font-size: 38px; font-weight: 500; line-height: 1.2; color: #fff; }
  h3 { font-size: 17px; font-weight: 500; color: #fff; margin-bottom: 10px; }
  .sub { font-size: 18px; color: rgba(255,255,255,0.5); line-height: 1.65; margin-top: 16px; max-width: 580px; }
  .accent { color: #7F77DD; }
  .accent-green { color: #5DCAA5; }
  .accent-coral { color: #F0997B; }
  .accent-amber { color: #EF9F27; }
  .line { width: 44px; height: 2px; background: linear-gradient(90deg, #534AB7, transparent); margin-bottom: 28px; }
  .body { font-size: 14px; color: rgba(255,255,255,0.55); line-height: 1.75; }
  .slide-num { position: absolute; bottom: 28px; right: 48px; font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 1px; }

  /* GRID */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
  .grid2-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  /* CARDS */
  .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; }
  .card-blue { border-top: 2px solid #534AB7; }
  .card-green { border-top: 2px solid #1D9E75; }
  .card-coral { border-top: 2px solid #993C1D; }
  .card-amber { border-top: 2px solid #854F0B; }
  .card-left-blue { border-left: 3px solid #534AB7; }
  .card-left-green { border-left: 3px solid #1D9E75; }
  .card-left-coral { border-left: 3px solid #D85A30; }
  .card-left-amber { border-left: 3px solid #BA7517; }

  /* TIMELINE */
  .timeline { display: flex; flex-direction: column; gap: 0; margin-top: 28px; }
  .tl-item { display: flex; gap: 20px; align-items: flex-start; padding-bottom: 28px; position: relative; }
  .tl-item:not(:last-child)::after { content: ''; position: absolute; left: 17px; top: 36px; bottom: 0; width: 1px; background: rgba(83,74,183,0.25); }
  .tl-dot { width: 36px; height: 36px; border-radius: 50%; background: rgba(83,74,183,0.15); border: 1px solid rgba(83,74,183,0.4); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #7F77DD; flex-shrink: 0; }
  .tl-dot.active { background: #534AB7; color: #fff; border-color: #534AB7; }
  .tl-year { font-size: 11px; color: #534AB7; font-weight: 600; letter-spacing: 1px; margin-bottom: 3px; text-transform: uppercase; }
  .tl-title { font-size: 15px; font-weight: 500; color: #fff; margin-bottom: 4px; }
  .tl-desc { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.6; }

  /* PILLS */
  .pill-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .pill { background: rgba(83,74,183,0.12); border: 1px solid rgba(83,74,183,0.35); border-radius: 20px; padding: 6px 16px; font-size: 13px; color: #AFA9EC; }

  /* VS */
  .vs-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 28px; }
  .vs-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-bottom: 10px; }
  .divider { width: 100%; height: 1px; background: rgba(255,255,255,0.07); margin: 18px 0; }
  .example { background: rgba(255,255,255,0.04); border-radius: 7px; padding: 10px 14px; font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 8px; }
  .example strong { color: rgba(255,255,255,0.85); font-weight: 500; }

  /* BIG NUM */
  .big-num { font-size: 52px; font-weight: 500; line-height: 1; }
  .metric { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 20px; }
  .metric-label { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 8px; }

  /* TOOL CARD */
  .tool-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; }
  .tool-name { font-size: 16px; font-weight: 500; color: #fff; margin-bottom: 4px; }
  .tool-maker { font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .tool-badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 500; margin-bottom: 12px; }
  .badge-blue { background: rgba(83,74,183,0.2); color: #AFA9EC; }
  .badge-green { background: rgba(29,158,117,0.2); color: #5DCAA5; }
  .badge-amber { background: rgba(186,117,23,0.2); color: #EF9F27; }
  .badge-coral { background: rgba(216,90,48,0.2); color: #F0997B; }

  /* PROMPT */
  .prompt-block { background: rgba(83,74,183,0.08); border: 1px solid rgba(83,74,183,0.25); border-radius: 10px; padding: 20px 24px; margin-top: 16px; }
  .prompt-bad { background: rgba(150,150,150,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px 20px; }
  .prompt-good { background: rgba(29,158,117,0.08); border: 1px solid rgba(29,158,117,0.25); border-radius: 10px; padding: 16px 20px; }
  .prompt-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  .prompt-text { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.65; font-style: italic; }

  /* PILLAR */
  .pillar { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 22px; text-align: center; }
  .pillar-icon { font-size: 28px; margin-bottom: 12px; }
  .pillar-num { font-size: 32px; font-weight: 500; color: #534AB7; margin-bottom: 8px; }

  /* ALERT */
  .alert { border-radius: 10px; padding: 18px 22px; margin-top: 16px; font-size: 14px; line-height: 1.65; }
  .alert-danger { background: rgba(162,45,45,0.1); border: 1px solid rgba(162,45,45,0.3); color: rgba(255,150,150,0.85); }
  .alert-warn { background: rgba(133,79,11,0.12); border: 1px solid rgba(133,79,11,0.35); color: rgba(240,200,100,0.85); }
  .alert-info { background: rgba(83,74,183,0.1); border: 1px solid rgba(83,74,183,0.3); color: #AFA9EC; }
  .alert-success { background: rgba(15,110,86,0.1); border: 1px solid rgba(15,110,86,0.3); color: #5DCAA5; }

  /* FUTURE */
  .future-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 28px; position: relative; overflow: hidden; }
  .future-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .future-card.fc1::before { background: linear-gradient(90deg, #534AB7, #7F77DD); }
  .future-card.fc2::before { background: linear-gradient(90deg, #1D9E75, #5DCAA5); }
  .future-card.fc3::before { background: linear-gradient(90deg, #854F0B, #EF9F27); }
  .future-num { font-size: 48px; font-weight: 500; opacity: 0.08; position: absolute; top: 16px; right: 20px; line-height: 1; }

  /* STEP ROW */
  .step-row { display: flex; align-items: flex-start; gap: 16px; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .step-row:last-child { border-bottom: none; }
  .step-dot { width: 28px; height: 28px; border-radius: 50%; background: rgba(83,74,183,0.2); border: 1px solid #534AB7; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #7F77DD; flex-shrink: 0; margin-top: 2px; }

  /* QUOTE */
  .quote { border-left: 3px solid #534AB7; padding: 20px 24px; margin: 24px 0; }
  .quote-text { font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.85); line-height: 1.5; font-style: italic; }
  .quote-author { font-size: 13px; color: rgba(255,255,255,0.35); margin-top: 10px; }
</style>
</head>

let currentMod = 0;
let currentSlide = 0;

function renderModNav() {
  document.getElementById('modNav').innerHTML = modules.map((m, i) =>
    `<button class="mod-btn ${i === currentMod ? 'active' : ''}" onclick="goMod(${i})">${m.label}</button>`
  ).join('');
}

function renderSlideNav() {
  document.getElementById('slideNav').innerHTML = modules[currentMod].slides.map((s, i) =>
    `<button class="slide-btn ${i === currentSlide ? 'active' : ''}" onclick="goSlide(${i})">${s.name}</button>`
  ).join('');
}

function renderSlide() {
  const mod = modules[currentMod];
  const slide = mod.slides[currentSlide];
  const total = mod.slides.length;
  document.getElementById('slideArea').innerHTML = `
    <div class="slide">
      ${slide.render()}
      <div class="slide-num">${String(currentSlide + 1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>
    </div>
  `;
}

function goMod(i) {
  currentMod = i;
  currentSlide = 0;
  renderAll();
}

function goSlide(i) {
  currentSlide = i;
  renderSlideNav();
  renderSlide();
}

function renderAll() {
  renderModNav();
  renderSlideNav();
  renderSlide();
}

renderAll();
